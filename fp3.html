<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>77</title>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const gpuId = urlParams.get('linkedId'); 

  const domain = "https://fingerprint.com";
  const path = "/r4a0Rd2Xs/web/v4/b9Y07pv2XnjDfsj5yA4u?ci=jsl/4.1.0";
  const url = domain + path;

  const fpPromise = import(url)
    .then(Fingerprint => Fingerprint.start())

  fpPromise
    .then(fp => {
      const options = {};
      if (gpuId) {
        options.linkedId = gpuId;
      }
      return fp.get(options);
    })
    .then(result => console.log(result.event_id, result.visitor_id))
    .catch(err => console.error("Ошибка:", err));
</script>
</head>
<body>
    <h1>77</h1>
</body>
</html>
