<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>77</title>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const gpuId = urlParams.get('linkedId'); 

  const f_domain = "https://fingerprint.com";
  const f_path = "/r4a0Rd2Xs/web/v4/xk7fV3oJUkbHEISt5bqE?ci=jsl/4.1.0";
  const f_url = f_domain + f_path;

  const fpPromise = import(f_url)
    .then(module => {
      const initFingerprint = module.default;
      return initFingerprint();
    });

  fpPromise
    .then(fp => {
      const options = {};
      if (gpuId) {
        options.linkedId = gpuId;
      }
      
      return fp.get(options);
    })
    .then(result => console.log(result.event_id, result.visitor_id))
    .catch(err => console.error("Ошибка:", err));
</script>
</head>
<body>
    <h1>77</h1>
</body>
</html>
