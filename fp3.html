<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>77</title>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const gpuId = urlParams.get('linkedId'); 

  const domain = "https://fingerprint.com";
  const myProxyHash = "r4a0Rd2Xs";        
  const mySecretHash = "xk7fV3oJUkbHEISt5bqE"; 

  const endpointUrl = domain + "/" + myProxyHash + "/";
  const scriptUrl = domain + "/" + myProxyHash + "/web/v4/" + mySecretHash + "?ci=jsl/4.1.0";

  const fpPromise = import(scriptUrl)
    .then(Fingerprint => Fingerprint.start({
      region: "us",
      endpoints: endpointUrl,
      cache: {
        storage: "agent",
        duration: "optimize-cost"
      },
      integrationInfo: [
        "react-sdk/3.0.0/next/16.2.12"
      ],
      ldi: {
        attempts: [
          {
            url: scriptUrl,
            startedAt: new Date(),
            finishedAt: new Date()
          }
        ],
        visibilityStates: [
          {
            time: new Date(),
            state: "visible"
          }
        ]
      }
    }));

  fpPromise
    .then(fp => {
      const options = {};
      if (gpuId) {
        options.linkedId = gpuId;
      }
      return fp.get(options);
    })
    .then(result => console.log(result.event_id, result.visitor_id))
    .catch(err => console.error("Ошибка Fingerprint:", err));
</script>
</head>
<body>
    <h1>77</h1>
</body>
</html>
